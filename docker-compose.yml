services:
  db:
    image: postgres:17
    container_name: vortex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gaming
    ports:
      - "5432:5432"
    volumes:
      - vortex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaming"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vortex-pgdata:
