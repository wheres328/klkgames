# Despliegue en produccion: app Next.js + PostgreSQL.
# Uso:
#   1) cp .env.example .env   (rellena AUTH_SECRET y BETTER_AUTH_URL)
#   2) docker compose -f docker-compose.deploy.yml up -d db
#   3) docker compose -f docker-compose.deploy.yml build app
#   4) docker compose -f docker-compose.deploy.yml up -d
# Para actualizar tras un git pull: repetir pasos 3 y 4 (con --build).

name: klkgames

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gaming
    ports:
      - "5432:5432"
    volumes:
      - klkgames-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaming"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # Durante el build, SSG consulta la BD que escucha en el host (puerto 5432).
      args:
        DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/gaming
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gaming
      AUTH_SECRET: ${AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NODE_ENV: production
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  klkgames-pgdata:
